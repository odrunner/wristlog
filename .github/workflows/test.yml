name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Unit tests + coverage gate (thresholds on wrotate_test.js — see vitest.config.js)
      - run: npm run test:coverage
      # Deno edge-function tests (jsr: imports, Deno.test) — separate runtime.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm run test:functions
