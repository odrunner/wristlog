name: Inject build version

on:
  push:
    branches: [main]

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Don't re-run on the bot's own version-bump commit
    if: "!startsWith(github.event.head_commit.message, 'chore: version')"

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute version and inject
        run: |
          # Format: M.D.YY.H.MM  (e.g. 2.28.26.5.47)
          VERSION=$(date -u "+%-m.%-d.%y.%-H.%M")
          echo "VERSION=${VERSION}"
          sed -i "s/const APP_VERSION = '[^']*'/const APP_VERSION = '${VERSION}'/" index.html

      - name: Commit version bump
        run: |
          VERSION=$(date -u "+%-m.%-d.%y.%-H.%M")
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "chore: version ${VERSION}"
          git push
