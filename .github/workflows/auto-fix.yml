name: Auto-Fix Bug (Claude Code)

# Triggered when an issue is labeled "auto-bug"
on:
  issues:
    types: [labeled]

jobs:
  auto-fix:
    if: github.event.label.name == 'auto-bug'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Install Claude Code CLI
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      # Run Claude Code to analyze and fix the bug
      - name: Analyze and fix bug
        id: claude-fix
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          # Create a branch for the fix
          BRANCH="auto-fix/issue-${ISSUE_NUMBER}"
          git checkout -b "$BRANCH"

          # Run Claude Code in non-interactive mode
          RESULT=$(claude --print --dangerously-skip-permissions \
            "You are fixing a bug reported by a user. Here is the bug report:

          Title: ${ISSUE_TITLE}
          Description:
          ${ISSUE_BODY}

          The main application is in index.html (a single-file web app).
          Fix the bug if you can identify it. Run 'npm test' to make sure tests still pass.
          If you cannot identify or fix the bug, explain why.

          IMPORTANT: Only modify files that need to change. Do not refactor unrelated code." 2>&1) || true

          echo "$RESULT"

          # Check if any files were modified
          if git diff --quiet && git diff --cached --quiet; then
            echo "no_changes=true" >> "$GITHUB_OUTPUT"
            echo "claude_output<<EOF" >> "$GITHUB_OUTPUT"
            echo "$RESULT" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          else
            echo "no_changes=false" >> "$GITHUB_OUTPUT"
            echo "claude_output<<EOF" >> "$GITHUB_OUTPUT"
            echo "$RESULT" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          fi

      # If Claude made changes, commit and create a PR
      - name: Create Pull Request
        if: steps.claude-fix.outputs.no_changes == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          BRANCH="auto-fix/issue-${ISSUE_NUMBER}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "Auto-fix: Issue #${ISSUE_NUMBER}

          Co-Authored-By: Claude <noreply@anthropic.com>"

          git push origin "$BRANCH" --force

          gh pr create \
            --title "Auto-fix: Issue #${ISSUE_NUMBER}" \
            --body "## Auto-Fix for #${ISSUE_NUMBER}

          This PR was automatically generated by Claude Code in response to a user bug report.

          **Please review carefully before merging.**

          ---
          _Auto-generated by the self-healing bug pipeline. Never auto-merged._" \
            --base main \
            --head "$BRANCH"

      # If Claude couldn't fix it, comment on the issue
      - name: Comment on issue (no fix)
        if: steps.claude-fix.outputs.no_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" \
            --body "$(cat <<EOF
          ### Claude Code Analysis

          I analyzed this bug report but was unable to produce a fix automatically.

          **Analysis:**
          \`\`\`
          ${{ steps.claude-fix.outputs.claude_output }}
          \`\`\`

          This issue needs manual investigation.

          ---
          _Auto-generated by the self-healing bug pipeline._
          EOF
          )"
