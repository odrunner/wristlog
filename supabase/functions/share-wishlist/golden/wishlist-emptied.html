  <link rel="icon" type="image/svg+xml" href="https://wrotate.com/icon.svg">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --bg: #e9edf1; --surface: #ffffff; --surface2: #f1f4f7; --border: #d3d9e1; --gold: #87661a; --gold-lt: #c9a84c; --text: #141a24; --muted: #566070; --danger-text: #b03636; --white: #fff; --radius: 10px; --radius-sm: 6px; --radius-btn: 8px; --radius-pill: 999px; --radius-round: 50%; --space-px: 1px; --space-0-5: .125rem; --space-1: .25rem; --space-1-5: .375rem; --space-2: .5rem; --space-2-5: .625rem; --space-3: .75rem; --space-3-5: .875rem; --space-4: 1rem; --space-5: 1.25rem; --space-6: 1.5rem; --space-8: 2rem; --space-10: 2.5rem; --space-12: 3rem; --space-16: 4rem; --fs-body: .9375rem; --fs-input: 1rem; --fs-xs: .68rem; --fs-sm: .75rem; --fs-base: .82rem; --fs-md: .88rem; --fs-xl: 1.1rem; --fs-2xl: 1.3rem; --fs-3xl: 1.6rem; --fs-4xl: 2.5rem; --fs-display: 2rem; --fw-semibold: 600; --fw-bold: 700; --fw-heavy: 800; --lh-none: 1; --lh-body: 1.55; --ls-snug: .02em; --ls-tight: .04em; --ls-eyebrow: .08em; --ls-wide: .16em; --ls-display: -.02em; --size-px: 1px; --size-6: 24px; --size-9: 36px; --size-10: 40px; --size-18: 72px; --size-20: 80px; --size-85: 340px; --size-105: 420px; --size-130: 520px; --size-max: 9999px; --opacity-dim: .5; --shadow-1: 0 1px 4px rgba(0,0,0,.18); --shadow-3: 0 4px 16px rgba(0,0,0,.25); --dur-fast: .15s; --z-header: 100; --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0b0b10; --surface: #141419; --surface2: #1c1c25; --border: #272734; --gold: #c9a84c; --gold-lt: #dbbe72; --text: #e6e6f0; --muted: #82829d; --danger-text: var(--danger); } }
    body { background: var(--bg); color: var(--text); font-family: var(--font-sans); min-height: 100vh; font-size: var(--fs-body); }
    a { color: var(--gold); text-decoration: none; }
    .topbar { position: sticky; top: 0; z-index: var(--z-header); display: flex; align-items: center; justify-content: center; padding: var(--space-3) var(--space-5); background: var(--surface); border-bottom: var(--space-px) solid var(--border); }
    .topbar-logo { display: inline-flex; align-items: center; gap: var(--space-1-5); font-size: var(--fs-xl); font-weight: var(--fw-heavy); letter-spacing: var(--ls-display); color: var(--gold); text-decoration: none; }
    .topbar-logo img { width: var(--size-6); height: var(--size-6); border-radius: var(--radius-sm); }
    .page-wrap { max-width: var(--size-130); margin: 0 auto; padding: var(--space-6) var(--space-4) var(--space-16); }
    .col-hero { text-align: center; padding: 0 0 var(--space-5); }
    .col-avatar { width: var(--size-18); height: var(--size-18); border-radius: var(--radius-round); background: var(--surface2); display: flex; align-items: center; justify-content: center; font-size: var(--fs-2xl); font-weight: var(--fw-bold); color: var(--muted); overflow: hidden; margin: 0 auto var(--space-3); }
    .col-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .col-name { font-size: var(--fs-2xl); font-weight: var(--fw-heavy); margin-bottom: var(--space-0-5); }
    .col-uname { font-size: var(--fs-base); color: var(--muted); margin-bottom: var(--space-1-5); }
    .col-label { font-size: var(--fs-md); color: var(--muted); line-height: var(--lh-body); white-space: pre-wrap; text-align: left; background: var(--surface); border: var(--space-px) solid var(--border); border-radius: var(--radius); padding: var(--space-3) var(--space-3-5); margin-top: var(--space-2-5); }
    .wl-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-3); }
    .wl-card { background: var(--surface); border: var(--space-px) solid var(--border); border-radius: var(--radius); overflow: hidden; }
    /* The surface2 background is the broken-image fallback: an image URL that
       404s leaves a neutral square rather than a torn-page icon. */
    .wl-card-img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; background: var(--surface2); }
    .wl-card-ph { width: 100%; aspect-ratio: 1; background: var(--surface2); display: flex; align-items: center; justify-content: center; font-size: var(--fs-2xl); font-weight: var(--fw-bold); color: var(--muted); }
    .wl-card-body { padding: var(--space-2-5) var(--space-3); }
    .wl-card-brand { font-size: var(--fs-xs); color: var(--muted); text-transform: uppercase; letter-spacing: var(--ls-tight); }
    .wl-card-name { font-size: var(--fs-md); font-weight: var(--fw-bold); margin: var(--space-0-5) 0; }
    .wl-card-ref { font-size: var(--fs-sm); color: var(--muted); }
    .wl-card-url { display: inline-block; font-size: var(--fs-sm); margin-top: var(--space-1); word-break: break-all; }
    .state-wrap { text-align: center; padding: var(--space-12) var(--space-4); }
    .state-icon { font-size: var(--fs-4xl); margin-bottom: var(--space-2); }
    .state-title { font-size: var(--fs-xl); font-weight: var(--fw-bold); margin-bottom: var(--space-1); }
    .state-sub { font-size: var(--fs-md); color: var(--muted); line-height: var(--lh-body); }
    .btn-cta { display: inline-block; background: var(--gold); color: var(--white); border: none; border-radius: var(--radius-btn); padding: var(--space-2-5) var(--space-6); font-size: var(--fs-body); font-weight: var(--fw-semibold); text-decoration: none; font-family: inherit; margin-top: var(--space-4); }
    .foot { text-align: center; margin-top: var(--space-8); font-size: var(--fs-base); color: var(--muted); }
  </style>
</head>
<body>
  <header class="topbar">
    <a href="https://wrotate.com/" class="topbar-logo"><img src="https://wrotate.com/icon.svg" alt=""> WRotate</a>
  </header>
  <main class="page-wrap">
    
    <div class="col-hero">
      <div class="col-avatar">S</div>
      <div class="col-name">Someone's wishlist</div>
      <div class="col-uname">0 watches</div>
      <div class="col-label">For my &lt;dealer&gt;
Budget 10k</div>
    </div>
    <div class="state-wrap"><div class="state-icon">⌚</div><div class="state-title">Nothing left in this list</div>
         <div class="state-sub">The watches on this link are no longer on the owner's wishlist.</div></div>
    
    <style>
      .sc-wrap { margin-top: var(--space-6); }
      .sc-title { font-size: var(--fs-body); font-weight: var(--fw-heavy); margin-bottom: var(--space-2-5); }
      .sc-item { background: var(--surface); border: var(--space-px) solid var(--border); border-radius: var(--radius); padding: var(--space-2-5) var(--space-3); margin-bottom: var(--space-2); }
      .sc-meta { font-size: var(--fs-sm); color: var(--muted); margin-bottom: var(--space-1); }
      .sc-name { font-weight: var(--fw-bold); color: var(--text); }
      .sc-body { font-size: var(--fs-md); white-space: pre-wrap; word-break: break-word; }
      .sc-empty { font-size: var(--fs-md); color: var(--muted); margin-bottom: var(--space-3); }
      .sc-form { background: var(--surface); border: var(--space-px) solid var(--border); border-radius: var(--radius); padding: var(--space-3); margin-top: var(--space-3); }
      .sc-form label { display: block; font-size: var(--fs-sm); color: var(--muted); margin: var(--space-1-5) 0 var(--space-1); }
      .sc-form input, .sc-form textarea { width: 100%; font: inherit; font-size: var(--fs-input); color: var(--text); background: var(--bg); border: var(--space-px) solid var(--border); border-radius: var(--radius-btn); padding: var(--space-2) var(--space-2-5); }
      .sc-form textarea { min-height: var(--size-20); resize: vertical; }
      .sc-hp { position: absolute; left: calc(-1 * var(--size-max)); width: var(--size-px); height: var(--size-px); overflow: hidden; }
      .sc-note { font-size: var(--fs-sm); color: var(--muted); margin-top: var(--space-1-5); }
      .sc-btn { display: inline-block; margin-top: var(--space-2-5); background: var(--gold); color: var(--white); border: none; border-radius: var(--radius-btn); padding: var(--space-2) var(--space-5); font: inherit; font-size: var(--fs-md); font-weight: var(--fw-semibold); cursor: pointer; }
      .sc-btn[disabled] { opacity: var(--opacity-dim); cursor: default; }
      .sc-err { font-size: var(--fs-base); color: var(--danger-text); margin-top: var(--space-1-5); min-height: 1em; }
    </style>
    <section class="sc-wrap" id="sc-wrap" data-kind="wishlist" data-token="tok">
      <div class="sc-title">Comments</div>
      <div id="sc-list"><div class="sc-empty" id="sc-empty">No comments yet — be the first.</div></div>
      <form class="sc-form" id="sc-form" autocomplete="off">
        <label for="sc-name">Your name</label>
        <input id="sc-name" name="name" maxlength="40" placeholder="So they know who this is from" required>
        <label for="sc-body">Comment</label>
        <textarea id="sc-body" name="body" maxlength="500" placeholder="Say something about these watches…" required></textarea>
        <div class="sc-hp" aria-hidden="true"><label for="sc-hp">Website</label><input id="sc-hp" name="hp" tabindex="-1" autocomplete="off"></div>
        <div class="sc-note">Visible to everyone who has this link.</div>
        <div class="sc-err" id="sc-err"></div>
        <button type="submit" class="sc-btn" id="sc-submit">Post comment</button>
      </form>
    </section>
    <script>
    (function () {
      var wrap = document.getElementById('sc-wrap'); if (!wrap) return;
      var form = document.getElementById('sc-form'), list = document.getElementById('sc-list');
      var nameEl = document.getElementById('sc-name'), bodyEl = document.getElementById('sc-body');
      var err = document.getElementById('sc-err'), btn = document.getElementById('sc-submit');
      try { var saved = localStorage.getItem('wr_sc_name'); if (saved && !nameEl.value) nameEl.value = saved; } catch (e) {}
      function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
      form.addEventListener('submit', function (ev) {
        ev.preventDefault(); err.textContent = ''; btn.disabled = true;
        var payload = { t: wrap.getAttribute('data-token'), name: nameEl.value, body: bodyEl.value, hp: document.getElementById('sc-hp').value };
        fetch(location.pathname + '?t=' + encodeURIComponent(payload.t), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) })
          .then(function (r) { return r.json().then(function (j) { return { status: r.status, j: j }; }); })
          .then(function (res) {
            btn.disabled = false;
            if (!res.j || !res.j.ok) { err.textContent = (res.j && res.j.error) || 'Could not post your comment. Please try again.'; return; }
            var c = res.j.comment; try { localStorage.setItem('wr_sc_name', c.name); } catch (e) {}
            var empty = document.getElementById('sc-empty'); if (empty) empty.remove();
            var div = document.createElement('div'); div.className = 'sc-item';
            div.innerHTML = '<div class="sc-meta"><span class="sc-name">' + esc(c.name) + '</span> · <span class="sc-time">just now</span></div><div class="sc-body">' + esc(c.body) + '</div>';
            list.appendChild(div); bodyEl.value = '';
          })
          .catch(function () { btn.disabled = false; err.textContent = 'Could not post your comment. Please try again.'; });
      });
    })();
    </script>
    <div class="foot">Shared from WRotate · <a href="https://wrotate.com/open">Start your own wishlist</a></div>
  </main>
</body>
</html>
