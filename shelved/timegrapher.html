<script>
// ── Timegrapher ──
let _tgAudioCtx = null, _tgStream = null, _tgScriptNode = null, _tgRunning = false, _tgDebugLog = null;
let _tgTicks = [], _tgStartTime = 0;
let _tgBph = 28800, _tgPosition = 'dial_up';
const TG_BPH_OPTIONS = [18000, 21600, 25200, 28800, 36000];
const TG_POSITIONS = [
  { val: 'dial_up', lbl: 'Dial Up' }, { val: 'dial_down', lbl: 'Dial Down' },
  { val: 'crown_up', lbl: 'Crown Up' }, { val: 'crown_down', lbl: 'Crown Down' },
  { val: 'crown_left', lbl: 'Crown Left' }, { val: 'crown_right', lbl: 'Crown Right' }
];

function openTimegrapher(watchId) {
  if (!currentUser || currentUser.id !== ADMIN_USER_ID) return;
  const modal = document.getElementById('timegrapher-modal');
  const sel = document.getElementById('tg-watch-select');
  sel.innerHTML = '<option value="">— Select a watch —</option>' +
    watches.map(w => `<option value="${w.id}"${w.id === watchId ? ' selected' : ''}>${escHtml(w.brand)} ${escHtml(w.name)}</option>`).join('');
  document.getElementById('tg-bph-chips').innerHTML = TG_BPH_OPTIONS.map(b =>
    `<div class="chip${b === _tgBph ? ' selected' : ''}" data-bph="${b}" onclick="selectTgBph(${b})">${(b/1000).toFixed(b%1000?1:0)}k</div>`
  ).join('');
  document.getElementById('tg-pos-chips').innerHTML = TG_POSITIONS.map(p =>
    `<div class="chip${p.val === _tgPosition ? ' selected' : ''}" data-pos="${p.val}" onclick="selectTgPos('${p.val}')">${p.lbl}</div>`
  ).join('');
  _tgTicks = [];
  document.getElementById('tg-results').style.display = 'none';
  document.getElementById('tg-save-btn').style.display = 'none';
  document.getElementById('tg-start-btn').textContent = 'Start Listening';
  document.getElementById('tg-mic-warning').style.display = 'none';
  document.getElementById('tg-noise-bar').style.width = '0%';
  document.getElementById('tg-noise-label').textContent = 'Waiting...';
  clearTgCanvas();
  loadTgHistory();
  modal.classList.remove('hidden');
}

function closeTimegrapher() {
  if (_tgRunning) stopTimegrapher();
  document.getElementById('timegrapher-modal').classList.add('hidden');
}

function selectTgBph(bph) {
  _tgBph = bph;
  document.querySelectorAll('#tg-bph-chips .chip').forEach(c =>
    c.classList.toggle('selected', c.dataset.bph === String(bph)));
}

function selectTgPos(pos) {
  _tgPosition = pos;
  document.querySelectorAll('#tg-pos-chips .chip').forEach(c =>
    c.classList.toggle('selected', c.dataset.pos === pos));
}

function toggleTimegrapher() {
  if (_tgRunning) stopTimegrapher(); else startTimegrapher();
}

let _tgSensitivity = 50;

async function startTimegrapher() {
  const warn = document.getElementById('tg-mic-warning');
  warn.style.display = 'none';

  const isPWA = window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;
  if (isPWA) {
    warn.innerHTML = 'Microphone requires Safari. Please open <a href="https://wrotate.com" style="color:var(--gold);text-decoration:underline;">wrotate.com</a> in Safari to use the Timegrapher.';
    warn.style.display = 'block';
    return;
  }

  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    warn.textContent = 'Microphone access is not available in this browser.';
    warn.style.display = 'block';
    return;
  }

  try {
    _tgStream = await navigator.mediaDevices.getUserMedia({
      audio: {
        echoCancellation: false,
        noiseSuppression: false,
        autoGainControl: true
      }
    });
  } catch (e) {
    warn.textContent = e.name === 'NotAllowedError'
      ? 'Microphone permission denied. Go to Settings → Safari → Microphone to allow.'
      : 'Could not access microphone: ' + e.message;
    warn.style.display = 'block';
    return;
  }

  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    _tgAudioCtx = new AC();
    if (_tgAudioCtx.state === 'suspended') await _tgAudioCtx.resume();
    const sampleRate = _tgAudioCtx.sampleRate;

    const source = _tgAudioCtx.createMediaStreamSource(_tgStream);

    const scriptNode = _tgAudioCtx.createScriptProcessor(2048, 1, 1);
    _tgScriptNode = scriptNode;

    _tgTicks = [];
    _tgStartTime = performance.now();
    _tgRunning = true;
    document.getElementById('tg-start-btn').textContent = 'Stop';
    document.getElementById('tg-save-btn').style.display = 'none';
    document.getElementById('tg-results').style.display = '';
    clearTgCanvas();

    const expectedInterval = 3600000 / _tgBph;
    let _tgRenderPending = false;
    let lastNoiseUpdate = 0;
    let bufferCount = 0;

    // Autocorrelation-based period detection
    const WINDOW_SAMPLES = 64;
    const windowDuration = WINDOW_SAMPLES / sampleRate * 1000;
    const envCapacity = Math.ceil(10000 / windowDuration);
    const envelope = new Float32Array(envCapacity);
    let envWrite = 0;
    let envCount = 0;
    const minLag = Math.max(2, Math.round((expectedInterval * 0.7) / windowDuration));
    const maxLag = Math.round((expectedInterval * 1.3) / windowDuration);
    let lastAnalysis = 0;
    const ANALYSIS_INTERVAL = 2000;
    let acRate = null, acBeatError = null, acConfidence = 0;
    let acDetectedInterval = 0;

    const _dbg = {
      sampleRate: sampleRate, bph: _tgBph, sensitivity: _tgSensitivity,
      bufferSize: 2048, startTime: Date.now(),
      bufferPeaks: [], bufferRms: [], peakHistogram: {},
      acResults: [],
      envWindowDuration: windowDuration,
      minLag: minLag, maxLag: maxLag,
    };

    scriptNode.onaudioprocess = function(e) {
      if (!_tgRunning) return;
      const samples = e.inputBuffer.getChannelData(0);
      const bufLen = samples.length;
      const now = performance.now();
      bufferCount++;

      let maxAmp = 0, sumSq = 0;
      for (let i = 0; i < bufLen; i++) {
        const s = samples[i];
        sumSq += s * s;
        const a = Math.abs(s);
        if (a > maxAmp) maxAmp = a;
      }
      const rms = Math.sqrt(sumSq / bufLen);

      if (bufferCount % 5 === 0 && _dbg.bufferPeaks.length < 500) {
        _dbg.bufferPeaks.push(+(maxAmp.toFixed(6)));
        _dbg.bufferRms.push(+(rms.toFixed(6)));
      }
      const bucket = maxAmp < 0.0001 ? '<0.0001' :
                     maxAmp < 0.001 ? '0.0001-0.001' :
                     maxAmp < 0.005 ? '0.001-0.005' :
                     maxAmp < 0.01 ? '0.005-0.01' :
                     maxAmp < 0.05 ? '0.01-0.05' :
                     maxAmp < 0.1 ? '0.05-0.1' : '>0.1';
      _dbg.peakHistogram[bucket] = (_dbg.peakHistogram[bucket] || 0) + 1;

      if (now - lastNoiseUpdate > 150) {
        lastNoiseUpdate = now;
        const pct = Math.min(100, maxAmp * 200);
        const bar = document.getElementById('tg-noise-bar');
        const lbl = document.getElementById('tg-noise-label');
        bar.style.width = pct + '%';
        if (envCount < envCapacity * 0.3) {
          bar.style.background = '#3b82f6';
          lbl.textContent = 'Accumulating signal... ' + Math.round(envCount / envCapacity * 100) + '%';
        } else if (acRate !== null) {
          bar.style.background = acConfidence > 0.3 ? '#22c55e' : '#eab308';
          lbl.textContent = 'Confidence: ' + (acConfidence * 100).toFixed(0) + '% | Interval: ' + acDetectedInterval.toFixed(1) + 'ms';
        } else {
          bar.style.background = '#eab308';
          lbl.textContent = 'Analyzing...';
        }
      }

      for (let start = 0; start + WINDOW_SAMPLES <= bufLen; start += WINDOW_SAMPLES) {
        let winEnergy = 0;
        for (let j = start; j < start + WINDOW_SAMPLES; j++) {
          winEnergy += samples[j] * samples[j];
        }
        envelope[envWrite % envCapacity] = winEnergy / WINDOW_SAMPLES;
        envWrite++;
        envCount = Math.min(envCount + 1, envCapacity);
      }

      if (now - lastAnalysis > ANALYSIS_INTERVAL && envCount > envCapacity * 0.3) {
        lastAnalysis = now;
        const N = envCount;
        let mean = 0;
        for (let i = 0; i < N; i++) mean += envelope[i];
        mean /= N;
        let variance = 0;
        for (let i = 0; i < N; i++) {
          const d = envelope[i] - mean;
          variance += d * d;
        }
        variance /= N;

        if (variance > 0) {
          let bestLag = 0, bestCorr = -1;
          const corrValues = [];
          for (let lag = minLag; lag <= maxLag && lag < N / 2; lag++) {
            let corr = 0;
            const pairs = N - lag;
            for (let i = 0; i < pairs; i++) {
              corr += (envelope[i] - mean) * (envelope[(i + lag) % envCapacity] - mean);
            }
            corr = corr / (pairs * variance);
            corrValues.push({ lag, corr: +(corr.toFixed(4)) });
            if (corr > bestCorr) { bestCorr = corr; bestLag = lag; }
          }

          acDetectedInterval = bestLag * windowDuration;
          acConfidence = Math.max(0, bestCorr);
          acRate = ((acDetectedInterval - expectedInterval) / expectedInterval) * 86400;
          acRate = Math.round(acRate * 10) / 10;

          const doubleLag = bestLag * 2;
          if (doubleLag < N / 2) {
            let corrDouble = 0;
            const pairsD = N - doubleLag;
            for (let i = 0; i < pairsD; i++) {
              corrDouble += (envelope[i] - mean) * (envelope[(i + doubleLag) % envCapacity] - mean);
            }
            corrDouble = corrDouble / (pairsD * variance);
            if (corrDouble > bestCorr) {
              const halfLag = Math.round(bestLag / 2);
              if (halfLag >= minLag) {
                let corrHalf = 0;
                const pairsH = N - halfLag;
                for (let i = 0; i < pairsH; i++) {
                  corrHalf += (envelope[i] - mean) * (envelope[(i + halfLag) % envCapacity] - mean);
                }
                corrHalf = corrHalf / (pairsH * variance);
                acBeatError = Math.abs(acDetectedInterval - halfLag * windowDuration * 2);
                acBeatError = Math.round(acBeatError * 100) / 100;
              }
            } else {
              acBeatError = 0;
            }
          }

          _dbg.acResults.push({
            t: +(now.toFixed(0)),
            envCount: N,
            bestLag, bestCorr: +(bestCorr.toFixed(4)),
            detectedIntervalMs: +(acDetectedInterval.toFixed(2)),
            rate: acRate,
            beatError: acBeatError,
            topCorrelations: corrValues.sort((a, b) => b.corr - a.corr).slice(0, 10)
          });
        }
      }

      if (acRate !== null && acConfidence > 0.1 && acDetectedInterval > 0) {
        const elapsed = now - _tgStartTime;
        const expectedTicks = Math.floor(elapsed / acDetectedInterval);
        while (_tgTicks.length < expectedTicks && _tgTicks.length < 10000) {
          const nextTick = _tgStartTime + (_tgTicks.length + 1) * acDetectedInterval;
          _tgTicks.push(nextTick);
        }
      }

      if (bufferCount % 8 === 0 && !_tgRenderPending) {
        _tgRenderPending = true;
        requestAnimationFrame(() => {
          const rateEl = document.getElementById('tg-rate');
          const beEl = document.getElementById('tg-beat-error');
          const tcEl = document.getElementById('tg-tick-count');
          if (acRate !== null && acConfidence > 0.1) {
            rateEl.textContent = (acRate >= 0 ? '+' : '') + acRate;
            rateEl.style.color = Math.abs(acRate) <= 20 ? '#22c55e' : Math.abs(acRate) <= 60 ? '#eab308' : '#ef4444';
            beEl.textContent = acBeatError !== null ? acBeatError.toFixed(2) : '—';
            tcEl.textContent = 'AC';
          } else {
            rateEl.textContent = '—';
            rateEl.style.color = '';
            beEl.textContent = '—';
            tcEl.textContent = 'analyzing';
          }
          renderTgDiagram();
          _tgRenderPending = false;
        });
      }

      const output = e.outputBuffer.getChannelData(0);
      for (let i = 0; i < output.length; i++) output[i] = 0;
    };

    _tgDebugLog = _dbg;

    source.connect(scriptNode);
    scriptNode.connect(_tgAudioCtx.destination);

  } catch (e) {
    console.error('[WristLog] Timegrapher audio error:', e);
    warn.textContent = 'Audio setup failed: ' + e.message;
    warn.style.display = 'block';
    if (_tgStream) { _tgStream.getTracks().forEach(t => t.stop()); _tgStream = null; }
    if (_tgAudioCtx) { _tgAudioCtx.close().catch(() => {}); _tgAudioCtx = null; }
  }
}

function stopTimegrapher() {
  _tgRunning = false;
  if (_tgScriptNode) { _tgScriptNode.disconnect(); _tgScriptNode = null; }
  if (_tgStream) { _tgStream.getTracks().forEach(t => t.stop()); _tgStream = null; }
  if (_tgAudioCtx) { _tgAudioCtx.close().catch(() => {}); _tgAudioCtx = null; }

  if (_tgDebugLog) {
    try {
      _tgDebugLog.endTime = Date.now();
      _tgDebugLog.totalTicks = _tgTicks.length;
      _tgDebugLog.tickTimestamps = _tgTicks.slice(0, 500).map(t => +(t.toFixed(1)));
      _tgDebugLog.results = computeTgResults(_tgTicks, _tgBph);
      localStorage.setItem('tg_debug', JSON.stringify(_tgDebugLog));
      console.log('[TG] Debug log saved to localStorage');
    } catch (e) { console.error('[TG] Debug save error:', e); }
    _tgDebugLog = null;
  }
  let copyBtn = document.getElementById('tg-copy-debug');
  if (!copyBtn) {
    copyBtn = document.createElement('button');
    copyBtn.id = 'tg-copy-debug';
    copyBtn.className = 'btn btn-ghost';
    copyBtn.textContent = 'Copy Debug Log';
    copyBtn.style.cssText = 'margin-top:8px;font-size:.75rem;width:100%;';
    copyBtn.onclick = function() {
      const d = localStorage.getItem('tg_debug');
      if (d) { navigator.clipboard.writeText(d).then(() => { copyBtn.textContent = 'Copied!'; setTimeout(() => { copyBtn.textContent = 'Copy Debug Log'; }, 2000); }); }
    };
    document.getElementById('tg-save-btn').parentNode.insertBefore(copyBtn, document.getElementById('tg-save-btn').nextSibling);
  }
  copyBtn.style.display = 'block';

  document.getElementById('tg-start-btn').textContent = 'Start Listening';
  if (_tgTicks.length >= 20) {
    document.getElementById('tg-save-btn').style.display = 'block';
  }
  updateTgResults();
}

function computeTgResults(ticks, bph) {
  if (ticks.length < 2) return { rate: null, beatError: null, tickCount: ticks.length, debug: 'Need more ticks' };
  const expectedInterval = 3600000 / bph;
  const intervals = [];
  for (let i = 1; i < ticks.length; i++) intervals.push(ticks[i] - ticks[i - 1]);
  let filtered = intervals.filter(iv => iv > expectedInterval * 0.3 && iv < expectedInterval * 3);
  if (filtered.length < 2) {
    const sorted = [...intervals].sort((a, b) => a - b);
    const q1 = sorted[Math.floor(sorted.length * 0.25)];
    const q3 = sorted[Math.floor(sorted.length * 0.75)];
    const iqr = q3 - q1;
    filtered = intervals.filter(iv => iv >= q1 - 1.5 * iqr && iv <= q3 + 1.5 * iqr);
  }
  const sorted = [...intervals].sort((a, b) => a - b);
  const medianIv = sorted[Math.floor(sorted.length / 2)];
  const minIv = sorted[0];
  const maxIv = sorted[sorted.length - 1];
  const debug = `${intervals.length} intervals, median=${Math.round(medianIv)}ms, range=${Math.round(minIv)}-${Math.round(maxIv)}ms, kept=${filtered.length}`;
  if (filtered.length < 2) return { rate: null, beatError: null, tickCount: ticks.length, debug };
  const avgInterval = filtered.reduce((a, b) => a + b, 0) / filtered.length;
  const rate = ((avgInterval - expectedInterval) / expectedInterval) * 86400;
  let beatError = null;
  if (filtered.length >= 4) {
    const odds = filtered.filter((_, i) => i % 2 === 0);
    const evens = filtered.filter((_, i) => i % 2 === 1);
    if (odds.length && evens.length) {
      const avgOdd = odds.reduce((a, b) => a + b, 0) / odds.length;
      const avgEven = evens.reduce((a, b) => a + b, 0) / evens.length;
      beatError = Math.abs(avgOdd - avgEven);
    }
  }
  return { rate: Math.round(rate * 10) / 10, beatError: beatError !== null ? Math.round(beatError * 100) / 100 : null, tickCount: ticks.length, debug };
}

function updateTgResults() {
  const r = computeTgResults(_tgTicks, _tgBph);
  document.getElementById('tg-results').style.display = '';
  document.getElementById('tg-rate').textContent = r.rate !== null ? (r.rate > 0 ? '+' : '') + r.rate : '—';
  document.getElementById('tg-beat-error').textContent = r.beatError !== null ? r.beatError.toFixed(2) : '—';
  document.getElementById('tg-ticks').textContent = r.tickCount;
  const rateEl = document.getElementById('tg-rate');
  if (r.rate !== null) {
    const absRate = Math.abs(r.rate);
    rateEl.style.color = absRate <= 5 ? '#22c55e' : absRate <= 15 ? '#eab308' : '#ef4444';
  }
  let dbgEl = document.getElementById('tg-debug');
  if (!dbgEl) {
    dbgEl = document.createElement('div');
    dbgEl.id = 'tg-debug';
    dbgEl.style.cssText = 'font-size:0.65rem;color:#888;text-align:center;margin-top:6px;font-family:monospace;';
    document.getElementById('tg-results').parentNode.insertBefore(dbgEl, document.getElementById('tg-results').nextSibling);
  }
  dbgEl.textContent = r.debug || '';
}

function clearTgCanvas() {
  const canvas = document.getElementById('tg-canvas');
  const dpr = window.devicePixelRatio || 1;
  canvas.width = canvas.clientWidth * dpr;
  canvas.height = canvas.clientHeight * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.fillStyle = '#1a1a1a';
  ctx.fillRect(0, 0, canvas.clientWidth, canvas.clientHeight);
  ctx.strokeStyle = '#333';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(0, canvas.clientHeight / 2);
  ctx.lineTo(canvas.clientWidth, canvas.clientHeight / 2);
  ctx.stroke();
}

function renderTgDiagram() {
  if (_tgTicks.length < 2) return;
  const canvas = document.getElementById('tg-canvas');
  const w = canvas.clientWidth, h = canvas.clientHeight;
  const dpr = window.devicePixelRatio || 1;
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.fillStyle = '#1a1a1a';
  ctx.fillRect(0, 0, w, h);
  ctx.strokeStyle = '#333';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(0, h / 2);
  ctx.lineTo(w, h / 2);
  ctx.stroke();
  ctx.strokeStyle = '#222';
  [0.25, 0.5, 0.75].forEach(frac => {
    ctx.beginPath();
    ctx.moveTo(0, h * frac);
    ctx.lineTo(w, h * frac);
    ctx.stroke();
  });
  const expectedInterval = 3600000 / _tgBph;
  const maxDeviation = 2;
  const visibleTicks = _tgTicks.slice(-500);
  const totalVisible = visibleTicks.length - 1;
  if (totalVisible < 1) return;
  const xStep = w / Math.max(totalVisible, 1);
  ctx.fillStyle = '#b8941f';
  for (let i = 1; i < visibleTicks.length; i++) {
    const interval = visibleTicks[i] - visibleTicks[i - 1];
    if (interval > expectedInterval * 2 || interval < expectedInterval * 0.5) continue;
    const deviation = interval - expectedInterval;
    const x = (i - 1) * xStep;
    const y = h / 2 - (deviation / maxDeviation) * (h / 2);
    ctx.beginPath();
    ctx.arc(x, Math.max(2, Math.min(h - 2, y)), 1.5, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.fillStyle = '#666';
  ctx.font = '10px sans-serif';
  ctx.fillText('+' + maxDeviation + 'ms', 4, 12);
  ctx.fillText('-' + maxDeviation + 'ms', 4, h - 4);
  ctx.fillText('0', 4, h / 2 - 4);
}

async function saveTimegrapherResult() {
  if (!currentUser || _tgTicks.length < 20) return;
  const r = computeTgResults(_tgTicks, _tgBph);
  const watchId = document.getElementById('tg-watch-select').value || null;
  const duration = Math.round((performance.now() - _tgStartTime) / 1000);
  const { error } = await db.from('timegrapher_results').insert({
    user_id: currentUser.id,
    watch_id: watchId,
    rate: r.rate,
    beat_error: r.beatError,
    bph: _tgBph,
    duration_seconds: duration,
    tick_count: r.tickCount,
    position: _tgPosition
  });
  if (error) { toast('Could not save — ' + error.message, 'error'); return; }
  toast('Result saved!');
  document.getElementById('tg-save-btn').style.display = 'none';
  loadTgHistory();
}

async function loadTgHistory() {
  const histEl = document.getElementById('tg-history');
  const listEl = document.getElementById('tg-history-list');
  if (!currentUser) { histEl.style.display = 'none'; return; }
  const watchId = document.getElementById('tg-watch-select')?.value;
  let q = db.from('timegrapher_results').select('*').eq('user_id', currentUser.id).order('created_at', { ascending: false }).limit(20);
  if (watchId) q = q.eq('watch_id', watchId);
  const { data, error } = await q;
  if (error || !data || data.length === 0) { histEl.style.display = 'none'; return; }
  histEl.style.display = '';
  listEl.innerHTML = data.map(r => {
    const d = new Date(r.created_at);
    const dateStr = d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
    const rateStr = r.rate !== null ? (r.rate > 0 ? '+' : '') + Number(r.rate).toFixed(1) + ' s/d' : '—';
    const beStr = r.beat_error !== null ? Number(r.beat_error).toFixed(2) + ' ms' : '—';
    const posStr = TG_POSITIONS.find(p => p.val === r.position)?.lbl || '';
    const rateColor = r.rate !== null ? (Math.abs(r.rate) <= 5 ? '#22c55e' : Math.abs(r.rate) <= 15 ? '#eab308' : '#ef4444') : 'var(--muted)';
    return `<div style="display:flex;align-items:center;justify-content:space-between;padding:.45rem 0;border-bottom:1px solid var(--border);font-size:.8rem;">
      <div>
        <span style="font-weight:600;color:${rateColor};">${rateStr}</span>
        <span style="color:var(--muted);margin-left:.4rem;">BE: ${beStr}</span>
      </div>
      <div style="color:var(--muted);font-size:.72rem;">${posStr} · ${dateStr}</div>
    </div>`;
  }).join('');
}

document.addEventListener('change', e => {
  if (e.target.id === 'tg-watch-select') loadTgHistory();
});
</script>
