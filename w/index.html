  <div id="page">
    <div id="loading">Loading…</div>
    <div id="notfound" style="display:none;">This model page doesn&#8217;t exist (yet). <a href="https://wrotate.com">WRotate</a></div>

  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.98.0/dist/umd/supabase.js" integrity="sha384-NRo2jhGGHu91p1IOcVC3UWI5Vnd+xGXfD/8N7Hr9+aGTK0d/Pl0i+kUZsB/zIlrK" crossorigin="anonymous"></script>
  <script src="/model-page.js?v=f7a7733f"></script>
  <script>
    const SUPABASE_URL = 'https://api.wrotate.com';
    const SUPABASE_KEY = 'sb_publishable_pxXMl4LD0xTLEqNKCZyQ5Q_qQfhNYbz';
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: false } });

    // First-party visit log, same shape as p/ and profile/: one page_visits row
    // per source+model per 30 min, slug carried in `path` so Admin → Traffic can
    // break views down per watch. PostHog's model_page_viewed below stays the
    // richer source (geo, full referrer) — this row is what the admin dashboard
    // can read without a PostHog key.
    (function() {
      try {
        const params = new URLSearchParams(window.location.search);
        const slug = (params.get('m') || '').toLowerCase().replace(/[^a-z0-9-]/g, '');
        const utm_source = params.get('utm_source');
        const ref = document.referrer || null;
        const externalRef = ref && !ref.includes(window.location.hostname) ? ref : null;
        const effectiveSource = utm_source || (externalRef ? null : 'direct');
        const dedupKey = 'wristlog_visit_w_' + slug + '_' + (effectiveSource || '') + '_' + (params.get('utm_campaign') || '');
        const lastVisit = Number(localStorage.getItem(dedupKey) || 0);
        if (Date.now() - lastVisit < 1800000) return;
        localStorage.setItem(dedupKey, String(Date.now()));
        db.from('page_visits').insert({
          utm_source: effectiveSource, utm_medium: params.get('utm_medium'), utm_campaign: params.get('utm_campaign'),
          utm_content: params.get('utm_content'), utm_term: params.get('utm_term'),
          referrer: externalRef, path: '/w/' + (slug ? '?m=' + slug : ''),
          user_agent: navigator.userAgent || null, user_id: null,
        }).then(() => {}).catch(() => {});
      } catch(e) {}
    })();

    let ctx = null;
    const el = document.getElementById('model-page-content');
    function show(id) { for (const x of ['loading', 'notfound']) document.getElementById(x).style.display = x === id ? '' : 'none'; }
    function render() { WRModelPage.render(el, ctx, handlers); }
    const handlers = {
      back() { if (history.length > 1) history.back(); else location.href = 'https://wrotate.com'; },
      async share() {
        const url = location.href, title = `${ctx.m.brand} ${ctx.m.name} on WRotate`;
        if (navigator.share) { try { await navigator.share({ title, url }); } catch (e) {} }
        else { try { await navigator.clipboard.writeText(url); } catch (e) {} }
      },
      openPost(id) { if (id) location.href = `/p/?id=${encodeURIComponent(id)}`; },
      openProfile(uid, username) { if (username) location.href = `/profile/?u=${encodeURIComponent(username)}`; },
      openModel(id, slug) { if (slug) location.href = `/w/?m=${encodeURIComponent(slug)}`; },
      openApp() { location.href = 'https://wrotate.com'; },
      track(ev, props) { if (window.posthog) posthog.capture(ev, { ...props, surface: 'public' }); },
    };
    async function load() {
      const params = new URLSearchParams(location.search);
      const slug = (params.get('m') || '').toLowerCase().replace(/[^a-z0-9-]/g, '');
      if (!slug) return show('notfound');
      const { data, error } = await db.rpc('model_page', { p_slug: slug });
      if (error || !data || !data.model) return show('notfound');
      const m = data.model;
      const { data: st } = await db.rpc('model_stats', { p_model_id: m.id });
      document.title = `${m.brand} ${m.name} — WRotate`;
      document.getElementById('canonical-link').href = `https://wrotate.com/w/?m=${encodeURIComponent(m.slug)}`;
      document.getElementById('og-title').content = `${m.brand} ${m.name} — WRotate`;
      if (m.hero_image) document.getElementById('og-image').content = m.hero_image;
      ctx = { m, o: data.owners || { total_owners: 0, visible: [] }, st: st || {}, facts: data.teasers || [], loggedIn: false, publicMode: true };
      show(null); render();
      // Who's coming and from where: PostHog adds $referrer, $referring_domain,
      // utm_* and geo to every event automatically — only the model is ours to name.
      if (window.posthog) posthog.capture('model_page_viewed', { model_id: m.id, model: m.slug, brand: m.brand, surface: 'public' });
    }
    load();
  </script>
