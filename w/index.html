<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' https://api.wrotate.com https://*.supabase.co data: blob: https:; connect-src 'self' https://api.wrotate.com https://*.supabase.co; font-src 'self'; object-src 'none'; base-uri 'self';">
  <title>WRotate Watch Model</title>
  <meta name="robots" content="index, follow">
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <link rel="canonical" id="canonical-link" href="https://wrotate.com/">
  <meta property="og:site_name" content="WRotate">
  <meta property="og:type" content="website">
  <meta id="og-title" property="og:title" content="WRotate Watch Model">
  <meta id="og-description" property="og:description" content="See who wears this watch on WRotate.">
  <meta id="og-image" property="og:image" content="https://api.wrotate.com/storage/v1/object/public/media/landing/collection.PNG">
  <script>
    (function(){
      try {
        const stored = localStorage.getItem('wrotate_theme');
        const prefer = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        if (prefer === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
      } catch(e) {}
    })();
  </script>
  <link rel="stylesheet" href="/design-system.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; min-height: 100vh; -webkit-font-smoothing: antialiased; }
    #page { max-width: 480px; margin: 0 auto; min-height: 100vh; background: var(--bg); }
    #loading, #notfound { color: var(--muted); padding: 3rem 1.2rem; font-size: .9rem; text-align: center; }
    #notfound a { color: var(--gold-lt); }
  </style>
</head>
<body>
  <div id="page">
    <div id="loading">Loading…</div>
    <div id="notfound" style="display:none;">This model page doesn&#8217;t exist (yet). <a href="https://wrotate.com">WRotate</a></div>
    <div id="model-page-content"></div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.98.0/dist/umd/supabase.js"></script>
  <script src="/model-page.js"></script>
  <script>
    const SUPABASE_URL = 'https://api.wrotate.com';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhuendlZXZ6cm9qbW91emhwd3p2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIxNjYwODAsImV4cCI6MjA4Nzc0MjA4MH0.5FR1m_kBNd1MlJGGmpXj30aLOFm8Xq3-34BCEmLH-vs';
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: false } });
    let ctx = null;
    const el = document.getElementById('model-page-content');
    function show(id) { for (const x of ['loading', 'notfound']) document.getElementById(x).style.display = x === id ? '' : 'none'; }
    function render() { ctx.tab = WRModelPage.render(el, ctx, handlers); }
    const handlers = {
      back() { if (history.length > 1) history.back(); else location.href = 'https://wrotate.com'; },
      async share() {
        const url = location.href, title = `${ctx.m.brand} ${ctx.m.name} on WRotate`;
        if (navigator.share) { try { await navigator.share({ title, url }); } catch (e) {} }
        else { try { await navigator.clipboard.writeText(url); } catch (e) {} }
      },
      setTab(tab, scroll) { ctx.tab = tab; render(); if (scroll) { const bar = document.getElementById('mp-tabs'); if (bar) window.scrollTo({ top: bar.getBoundingClientRect().top + window.scrollY - 8, behavior: 'smooth' }); } },
      openModel(id, slug) { if (slug) location.href = `/w/?m=${encodeURIComponent(slug)}`; },
      openApp() { location.href = 'https://wrotate.com'; },
    };
    async function load() {
      const params = new URLSearchParams(location.search);
      const slug = (params.get('m') || '').toLowerCase().replace(/[^a-z0-9-]/g, '');
      if (!slug) return show('notfound');
      const { data, error } = await db.rpc('model_page', { p_slug: slug });
      if (error || !data || !data.model) return show('notfound');
      const m = data.model;
      const { data: st } = await db.rpc('model_stats', { p_model_id: m.id });
      document.title = `${m.brand} ${m.name} — WRotate`;
      document.getElementById('canonical-link').href = `https://wrotate.com/w/?m=${encodeURIComponent(m.slug)}`;
      document.getElementById('og-title').content = `${m.brand} ${m.name} — WRotate`;
      if (m.hero_image) document.getElementById('og-image').content = m.hero_image;
      ctx = { m, o: data.owners || { total_owners: 0, visible: [] }, st: st || {}, facts: data.teasers || [], tab: 'data', loggedIn: false, publicMode: true };
      show(null); render();
    }
    load();
  </script>
</body>
</html>
