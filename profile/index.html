<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' https://api.wrotate.com https://*.supabase.co data: blob: https:; connect-src 'self' https://api.wrotate.com https://*.supabase.co; font-src 'self'; object-src 'none'; base-uri 'self';">
  <title>WRotate Profile</title>
  <meta name="robots" content="index, follow">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="canonical" id="canonical-link" href="https://wrotate.com/">
  <!-- OG tags filled dynamically -->
  <meta property="og:site_name" content="WRotate">
  <meta property="og:type" content="profile">
  <meta id="og-title" property="og:title" content="WRotate Profile">
  <meta id="og-description" property="og:description" content="Check out this watch collection on WRotate.">
  <meta id="og-url" property="og:url" content="https://wrotate.com/">
  <meta id="og-image" property="og:image" content="https://api.wrotate.com/storage/v1/object/public/media/landing/collection.PNG">
  <script>
    // Apply theme before paint to avoid flash
    (function(){
      try {
        const stored = localStorage.getItem('wrotate_theme');
        const prefer = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        if (prefer === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
      } catch(e) {}
    })();
  </script>
  <link rel="stylesheet" href="/design-system.css?v=b6aabad4">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      min-height: 100vh;
      font-size: var(--fs-body);
    }
    a { color: var(--gold-text); text-decoration: none; }
    a:hover { color: var(--gold-lt); }

    /* ── Top bar ── */
    .topbar {
      position: sticky; top: 0; z-index: var(--z-header);
      display: flex; align-items: center; justify-content: space-between;
      padding: var(--space-3) var(--space-5);
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    .topbar-logo {
      font-size: var(--fs-xl); font-weight: var(--fw-heavy); letter-spacing: var(--ls-display);
      color: var(--gold-text); text-decoration: none;
    }
    .topbar-logo:hover { color: var(--gold-lt); }
    .topbar-actions { display: flex; gap: var(--space-2-5); align-items: center; }
    .btn-open-app {
      background: var(--gold); color: var(--white); border: none;
      border-radius: var(--radius-btn); padding: var(--space-1-5) var(--space-4);
      font-size: var(--fs-base); font-weight: var(--fw-semibold); cursor: pointer;
      font-family: inherit; text-decoration: none; display: inline-block;
      transition: opacity var(--dur-fast);
    }
    .btn-open-app:hover { opacity: var(--opacity-hover); color: var(--white); }

    /* ── Layout ── */
    .page-wrap { max-width: var(--size-170); margin: 0 auto; padding: var(--space-6) var(--space-4) var(--space-16); }

    /* ── Profile hero ── */
    .profile-hero {
      display: flex; flex-direction: column; align-items: center;
      text-align: center; padding: var(--space-8) 0 var(--space-6); gap: var(--space-2-5);
    }
    .avatar {
      width: var(--size-20); height: var(--size-20); border-radius: var(--radius-round);
      background: var(--gold); color: var(--black);
      font-size: var(--fs-3xl); font-weight: var(--fw-bold);
      display: flex; align-items: center; justify-content: center;
      overflow: hidden; flex-shrink: 0;
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .display-name { font-size: var(--fs-2xl); font-weight: var(--fw-bold); }
    .username-lbl { font-size: var(--fs-base); color: var(--muted); }
    .official-badge {
      display: inline-block; background: var(--gold-dim); color: var(--gold-text);
      font-size: var(--fs-2xs); font-weight: var(--fw-bold); letter-spacing: var(--ls-tight);
      padding: var(--space-0-5) var(--space-1-5); border-radius: var(--radius-xs); text-transform: uppercase;
      vertical-align: middle; margin-left: var(--space-1);
    }
    .bio-text { font-size: var(--fs-md); color: var(--muted); max-width: var(--size-100); line-height: var(--lh-body); }

    /* ── Stats bar ── */
    .stats-bar {
      display: flex; justify-content: center; gap: 0;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); overflow: hidden; margin-bottom: var(--space-5);
    }
    .stat-cell {
      flex: 1; text-align: center; padding: var(--space-3-5) var(--space-2);
      border-right: 1px solid var(--border);
    }
    .stat-cell:last-child { border-right: none; }
    .stat-val { font-size: var(--fs-2xl); font-weight: var(--fw-bold); color: var(--gold-text); }
    .stat-lbl { font-size: var(--fs-xs); color: var(--muted); text-transform: uppercase; letter-spacing: var(--ls-tight); margin-top: var(--space-0-5); }

    /* ── Section ── */
    .section-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: var(--space-4) var(--space-5); margin-bottom: var(--space-4);
    }
    .section-title {
      font-size: var(--fs-sm); font-weight: var(--fw-bold); letter-spacing: var(--ls-eyebrow);
      text-transform: uppercase; color: var(--muted); margin-bottom: var(--space-4);
    }

    /* ── Watch grid ── */
    .watch-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: var(--space-3);
    }
    .watch-card {
      border-radius: var(--radius-btn); overflow: hidden;
      background: var(--surface2); border: 1px solid var(--border);
      cursor: default;
    }
    .watch-card-img {
      width: 100%; aspect-ratio: 1;
      object-fit: cover; display: block;
    }
    .watch-card-placeholder {
      width: 100%; aspect-ratio: 1;
      display: flex; align-items: center; justify-content: center;
      background: var(--gold-dim);
      font-size: var(--fs-xl); font-weight: var(--fw-bold); color: var(--gold-text);
    }
    .watch-card-body { padding: var(--space-2) var(--space-2-5); }
    .watch-card-brand { font-size: var(--fs-2xs); color: var(--muted); text-transform: uppercase; letter-spacing: var(--ls-tight); }
    .watch-card-name { font-size: var(--fs-base); font-weight: var(--fw-semibold); line-height: var(--lh-compact); margin-top: var(--space-0-5); }
    .watch-card-wears { font-size: var(--fs-xs); color: var(--muted); margin-top: var(--space-1); }

    /* ── CTA banner ── */
    .cta-banner {
      background: var(--gold-dim); border: 1px solid color-mix(in srgb, var(--gold) 25%, transparent);
      border-radius: var(--radius); padding: var(--space-6); text-align: center;
      margin-top: var(--space-6);
    }
    [data-theme="dark"] .cta-banner { border-color: color-mix(in srgb, var(--gold) 20%, transparent); }
    .cta-title { font-size: var(--fs-xl); font-weight: var(--fw-bold); margin-bottom: var(--space-1-5); }
    .cta-sub { font-size: var(--fs-base); color: var(--muted); margin-bottom: var(--space-4); line-height: var(--lh-body); }
    .btn-cta {
      display: inline-block; background: var(--gold); color: var(--white); border: none;
      border-radius: var(--radius-btn); padding: var(--space-2-5) var(--space-6);
      font-size: var(--fs-md); font-weight: var(--fw-bold); cursor: pointer;
      font-family: inherit; text-decoration: none; transition: opacity var(--dur-fast);
    }
    .btn-cta:hover { opacity: var(--opacity-hover); color: var(--white); }

    /* ── States ── */
    .state-wrap { text-align: center; padding: var(--space-16) var(--space-4); }
    .state-icon { font-size: var(--fs-4xl); margin-bottom: var(--space-3); }
    .state-title { font-size: var(--fs-xl); font-weight: var(--fw-bold); margin-bottom: var(--space-1-5); }
    .state-sub { font-size: var(--fs-md); color: var(--muted); max-width: var(--size-80); margin: 0 auto; line-height: var(--lh-body); }
    .spinner {
      width: var(--size-9); height: var(--size-9); border: 3px solid var(--border);
      border-top-color: var(--gold); border-radius: var(--radius-round);
      animation: spin .7s linear infinite; margin: 0 auto var(--space-4);
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Private notice ── */
    .private-wrap { text-align: center; padding: var(--space-12) var(--space-4); }

    @media (max-width: 420px) {
      .watch-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>

  <header class="topbar">
    <a href="https://wrotate.com/" class="topbar-logo">WRotate</a>
    <div class="topbar-actions">
      <a href="https://wrotate.com/" class="btn-open-app">Open App</a>
    </div>
  </header>

  <main class="page-wrap" id="main-content">
    <div class="state-wrap">
      <div class="spinner"></div>
      <div class="state-sub">Loading profile…</div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.98.0/dist/umd/supabase.js"></script>
  <script>
    const SUPABASE_URL = 'https://api.wrotate.com';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhuendlZXZ6cm9qbW91emhwd3p2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIxNjYwODAsImV4cCI6MjA4Nzc0MjA4MH0.5FR1m_kBNd1MlJGGmpXj30aLOFm8Xq3-34BCEmLH-vs';
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: false } });

    // Track visit on shared profile page
    (function() {
      try {
        const params = new URLSearchParams(window.location.search);
        const utm_source = params.get('utm_source');
        const ref = document.referrer || null;
        const externalRef = ref && !ref.includes(window.location.hostname) ? ref : null;
        const effectiveSource = utm_source || (externalRef ? null : 'direct');
        const dedupKey = 'wristlog_visit_' + (effectiveSource || '') + '_' + (params.get('utm_campaign') || '');
        const lastVisit = Number(localStorage.getItem(dedupKey) || 0);
        if (Date.now() - lastVisit < 1800000) return;
        localStorage.setItem(dedupKey, String(Date.now()));
        db.from('page_visits').insert({
          utm_source: effectiveSource, utm_medium: params.get('utm_medium'), utm_campaign: params.get('utm_campaign'),
          utm_content: params.get('utm_content'), utm_term: params.get('utm_term'),
          referrer: externalRef, path: window.location.pathname,
          user_agent: navigator.userAgent || null, user_id: null,
        }).then(() => {}).catch(() => {});
      } catch(e) {}
    })();

    // Thumbnail siblings (`<name>_thumb.jpg`, 240 px) exist for watches/, avatars/,
    // wishlist/ and clubs/ media — mirrors thumbUrlFor() in index.html. On a 404
    // the capture listener swaps back to the original.
    function thumbUrlFor(url) {
      const marker = '/storage/v1/object/public/media/';
      const idx = (url || '').indexOf(marker);
      if (idx < 0) return null;
      const qIdx = url.indexOf('?', idx);
      const path = url.slice(idx + marker.length, qIdx >= 0 ? qIdx : undefined);
      if (!['watches/', 'avatars/', 'wishlist/', 'clubs/'].some(f => path.startsWith(f))) return null;
      const dot = path.lastIndexOf('.');
      if (dot < 0 || dot < path.lastIndexOf('/') || path.slice(0, dot).endsWith('_thumb')) return null;
      return url.slice(0, idx + marker.length) + path.slice(0, dot) + '_thumb' + path.slice(dot) + (qIdx >= 0 ? url.slice(qIdx) : '');
    }
    function thumbSrcAttrs(url, escFn) {
      const t = thumbUrlFor(url);
      return t ? `src="${escFn(t)}" data-full="${escFn(url)}"` : `src="${escFn(url)}"`;
    }
    document.addEventListener('error', e => {
      const el = e.target;
      if (!el || el.tagName !== 'IMG') return;
      const full = el.getAttribute('data-full');
      if (!full || el.getAttribute('src') === full) return;
      el.removeAttribute('data-full');
      el.src = full;
      e.stopPropagation();
    }, true);

    function escHtml(s) {
      return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function initials(name) {
      return (name || '').trim().split(/\s+/).map(w => w[0] || '').join('').slice(0, 2).toUpperCase() || '?';
    }

    function renderAvatar(profile) {
      if (profile.avatar_url) {
        const fb = escHtml(initials(profile.display_name || profile.username));
        return `<img ${thumbSrcAttrs(profile.avatar_url, escHtml)} alt="" onerror="this.replaceWith(document.createTextNode('${fb}'))">`;
      }
      return escHtml(initials(profile.display_name || profile.username));
    }

    function renderError(msg) {
      document.getElementById('main-content').innerHTML = `
        <div class="state-wrap">
          <div class="state-icon">⌚</div>
          <div class="state-title">Profile not found</div>
          <div class="state-sub">${escHtml(msg)}</div>
          <br>
          <a href="https://wrotate.com/" class="btn-cta u-mt-2">Go to WRotate</a>
        </div>`;
    }

    function renderPrivate(profile) {
      const name = escHtml(profile.display_name || profile.username || 'This user');
      document.title = `${profile.display_name || profile.username} — WRotate`;
      document.getElementById('main-content').innerHTML = `
        <div class="profile-hero">
          <div class="avatar">${renderAvatar(profile)}</div>
          <div class="display-name">${name}${profile.is_official ? '<span class="official-badge">Official</span>' : ''}</div>
          ${profile.username ? `<div class="username-lbl">@${escHtml(profile.username)}</div>` : ''}
        </div>
        <div class="private-wrap">
          <div class="state-icon">🔒</div>
          <div class="state-title">Private profile</div>
          <div class="state-sub">This collection is private. Follow ${name} on WRotate to see their watches.</div>
          <br>
          <a href="https://wrotate.com/" class="btn-cta u-mt-2">Join WRotate</a>
        </div>`;
    }

    function renderProfile(profile, watches, wearCounts) {
      const name = escHtml(profile.display_name || profile.username || '');
      const uname = profile.username ? `@${escHtml(profile.username)}` : '';
      const bio = profile.bio ? `<div class="bio-text">${escHtml(profile.bio)}</div>` : '';
      const badge = profile.is_official ? '<span class="official-badge">Official</span>' : '';

      // Update page title + OG
      document.title = `${profile.display_name || profile.username} — WRotate`;
      // Trailing slash matters: /profile?u=x 301s to /profile/?u=x, and a canonical
      // that redirects is a wasted hop for crawlers.
      const profileUrl = `https://wrotate.com/profile/?u=${encodeURIComponent(profile.username || '')}`;
      document.getElementById('canonical-link').href = profileUrl;
      document.getElementById('og-title').content = `${profile.display_name || profile.username} — WRotate`;
      document.getElementById('og-description').content = profile.bio || `Check out ${profile.display_name || profile.username}'s watch collection on WRotate.`;
      document.getElementById('og-url').content = profileUrl;
      if (profile.avatar_url) document.getElementById('og-image').content = profile.avatar_url;

      // Stats
      const totalWears = Object.values(wearCounts).reduce((a, b) => a + b, 0);
      let mostWorn = null, mostWears = 0;
      for (const w of watches) {
        const c = wearCounts[w.id] || 0;
        if (c > mostWears) { mostWears = c; mostWorn = w; }
      }
      const mostWornHtml = mostWorn
        ? `<div class="stat-val" title="${escHtml(mostWorn.brand ? mostWorn.brand + ' ' + mostWorn.name : mostWorn.name)}">${escHtml(mostWorn.brand ? mostWorn.brand + ' ' + (mostWorn.name || '') : (mostWorn.name || '—'))}</div>`
        : `<div class="stat-val">—</div>`;

      // Watch grid
      let gridHtml = '';
      if (watches.length > 0) {
        const sorted = [...watches].sort((a, b) => (wearCounts[b.id] || 0) - (wearCounts[a.id] || 0));
        gridHtml = sorted.map(w => {
          const imgHtml = w.image
            ? `<img class="watch-card-img" ${thumbSrcAttrs(w.image, escHtml)} alt="" loading="lazy">`
            : `<div class="watch-card-placeholder">${escHtml(initials((w.brand || '') + ' ' + (w.name || '')))}</div>`;
          const wears = wearCounts[w.id] || 0;
          return `
            <div class="watch-card">
              ${imgHtml}
              <div class="watch-card-body">
                ${w.brand ? `<div class="watch-card-brand">${escHtml(w.brand)}</div>` : ''}
                <div class="watch-card-name">${escHtml(w.name || '—')}</div>
                <div class="watch-card-wears">${wears} wear${wears !== 1 ? 's' : ''}</div>
              </div>
            </div>`;
        }).join('');
      }

      const collectionSection = watches.length > 0
        ? `<div class="section-card">
             <div class="section-title">Collection (${watches.length})</div>
             <div class="watch-grid">${gridHtml}</div>
           </div>`
        : '';

      document.getElementById('main-content').innerHTML = `
        <div class="profile-hero">
          <div class="avatar">${renderAvatar(profile)}</div>
          <div class="display-name">${name}${badge}</div>
          ${uname ? `<div class="username-lbl">${uname}</div>` : ''}
          ${bio}
        </div>

        <div class="stats-bar">
          <div class="stat-cell">
            <div class="stat-val">${watches.length}</div>
            <div class="stat-lbl">Watches</div>
          </div>
          <div class="stat-cell">
            <div class="stat-val">${totalWears}</div>
            <div class="stat-lbl">Total Wears</div>
          </div>
          <div class="stat-cell">
            ${mostWornHtml}
            <div class="stat-lbl">Most Worn</div>
          </div>
        </div>

        ${collectionSection}

        <div class="cta-banner">
          <div class="cta-title">Track your collection on WRotate</div>
          <div class="cta-sub">Log every wear, track cost-per-wear, follow other collectors, and discover great watches.</div>
          <a href="https://wrotate.com/" class="btn-cta">Join for Free</a>
        </div>`;
    }

    async function loadProfile() {
      const params = new URLSearchParams(location.search);
      const username = params.get('u');
      if (!username) { renderError('No username specified.'); return; }

      // Fetch profile
      const { data: profile, error: profErr } = await db
        .from('profiles')
        .select('id, username, display_name, bio, avatar_url, profile_privacy, collection_visibility, is_official')
        .eq('username', username)
        .maybeSingle();

      if (profErr) {
        console.error('[WRotate] profile query error:', profErr);
        renderError(`Something went wrong loading this profile. (${profErr.message})`);
        return;
      }
      if (!profile) {
        renderError(`No user found with username "${username}".`);
        return;
      }

      // Check if profile is public
      const privacy = profile.profile_privacy || 'public';
      const collVis = profile.collection_visibility || 'public';
      if (privacy !== 'public' || collVis === 'private') {
        renderPrivate(profile);
        return;
      }

      // Fetch public watches
      const { data: watchRows, error: watchErr } = await db
        .from('watches')
        .select('id, brand, name, image, watch_privacy')
        .eq('user_id', profile.id)
        .or('watch_privacy.eq.public,watch_privacy.is.null');

      const watches = watchErr ? [] : (watchRows || []);

      // Fetch wear counts via logs (public watches only)
      let wearCounts = {};
      if (watches.length > 0) {
        const watchIds = watches.map(w => w.id);
        const { data: logs } = await db
          .from('logs')
          .select('watch_id, date')
          .eq('user_id', profile.id)
          .in('watch_id', watchIds);
        const seen = new Set();
        for (const log of (logs || [])) {
          const k = log.watch_id + '|' + log.date;
          if (!seen.has(k)) { seen.add(k); wearCounts[log.watch_id] = (wearCounts[log.watch_id] || 0) + 1; }
        }
      }

      renderProfile(profile, watches, wearCounts);
    }

    loadProfile().catch(err => {
      console.error('[WRotate] profile page error:', err);
      renderError('Something went wrong loading this profile.');
    });
  </script>
</body>
</html>
