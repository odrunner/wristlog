<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self'; object-src 'none'; base-uri 'self';">
<title>Open WRotate</title>
<!-- Redirect stub, not a content page — keep it out of the index. -->
<meta name="robots" content="noindex, follow">
<script>
  var isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
  if (isIOS) {
    window.location.replace('https://apps.apple.com/us/app/wrotate/id6760091102');
  } else {
    // Forward the query string. Email CTAs must point at /open (the AASA file
    // excludes / and /index.html), so this stub is the ONLY way a campaign
    // parameter like ?feedback= reaches the app — dropping it here silently
    // turned every parameterised email link into a plain "open the app" link.
    window.location.replace('https://wrotate.com/' + (window.location.search || ''));
  }
</script>
<!-- AFTER the redirect script on purpose: a stylesheet before an inline script makes the browser wait
     for the stylesheet before running it, which would delay the redirect. -->
<link rel="stylesheet" href="/design-system.css?v=b55de348">
<!-- AFTER the redirect script too, so it never delays the redirect.
     Languages (docs/i18n.md). English runs none of this: no request, no work. A member who
     chose another language in the app (wr_lang, same origin) gets that dictionary plus the
     shared runtime /i18n/page.js; both are generated, and their ?v= hashes stamped here,
     by scripts/i18n.mjs. -->
<script>
  (function () {
    try {
      var FILES = { es: 'i18n/es.js?v=a7a9bbca', it: 'i18n/it.js?v=4101c580', fr: 'i18n/fr.js?v=cc13ed0f', tr: 'i18n/tr.js?v=ec2d7bdc', de: 'i18n/de.js?v=90b32c93', pt: 'i18n/pt.js?v=5d0f825d' };
      var RUNTIME = 'i18n/page.js?v=9ea112dd';
      var m = /[?&]lang=([a-z]{2})\b/.exec(location.search);
      if (m) localStorage.setItem('wr_lang', m[1]);
      var lang = localStorage.getItem('wr_lang');
      if (!lang || !FILES[lang]) return;
      document.documentElement.lang = lang;
      document.write('<script src=/' + FILES[lang] + '><\/script><script src=/' + RUNTIME + '><\/script>');
    } catch (e) {}
  })();
</script>
</head>
<body class="row-center u-mt-0 u-mr-0 u-mb-0 u-ml-0 u-ff-font-sans u-bg-bg u-c-text u-minh-100vh u-ta-center">
  <div>
    <p class="u-fs-xl u-mb-4">Redirecting to WRotate...</p>
    <a href="https://wrotate.com" class="u-c-gold-text">Open WRotate</a>
  </div>
</body>
</html>
