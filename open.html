<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Open WRotate</title>
<!-- Redirect stub, not a content page — keep it out of the index. -->
<meta name="robots" content="noindex, follow">
<script>
  var isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
  if (isIOS) {
    window.location.replace('https://apps.apple.com/us/app/wrotate/id6760091102');
  } else {
    // Forward the query string. Email CTAs must point at /open (the AASA file
    // excludes / and /index.html), so this stub is the ONLY way a campaign
    // parameter like ?feedback= reaches the app — dropping it here silently
    // turned every parameterised email link into a plain "open the app" link.
    window.location.replace('https://wrotate.com/' + (window.location.search || ''));
  }
</script>
<!-- AFTER the redirect script on purpose: a stylesheet before an inline script makes the browser wait
     for the stylesheet before running it, which would delay the redirect. -->
<link rel="stylesheet" href="/design-system.css?v=89bd733f">
</head>
<body style="margin:0;font-family:var(--font-sans);background:var(--bg);color:var(--text);display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center;">
  <div>
    <p style="font-size:var(--fs-xl);margin-bottom:var(--space-4);">Redirecting to WRotate...</p>
    <a href="https://wrotate.com" style="color:var(--gold-text);">Open WRotate</a>
  </div>
</body>
</html>
