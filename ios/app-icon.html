<!DOCTYPE html>
<html>
<head>
<style>
  body { margin: 0; display: flex; align-items: center; justify-content: center; width: 1024px; height: 1024px; background: transparent; }
  .icon {
    width: 1024px;
    height: 1024px;
    background: linear-gradient(145deg, #1a1a1e 0%, #0d0d0f 100%);
    border-radius: 224px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    position: relative;
  }
  svg { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -55%); }
  .letter {
    position: absolute;
    bottom: 260px;
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
    font-weight: 800;
    font-size: 240px;
    color: #C8A55A;
    letter-spacing: 0.04em;
  }
</style>
</head>
<body>
  <div class="icon">
    <svg width="420" height="420" viewBox="0 0 32 32" fill="none">
      <path d="M 21 7.3 A 10 10 0 1 1 11 7.3" stroke="#C8A55A" stroke-width="2" stroke-linecap="round"/>
      <polygon points="11,7.3 8.5,9.5 7.7,6.6" fill="#C8A55A"/>
      <circle cx="16" cy="16" r="2.5" fill="#C8A55A"/>
    </svg>
    <div class="letter">W</div>
  </div>
</body>
</html>
