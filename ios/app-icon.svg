    <path d="M 5 -8.7 A 10 10 0 1 1 -5 -8.7" stroke="#C8A55A" stroke-width="1.8" stroke-linecap="round" fill="none"/>
    <polygon points="-5,-8.7 -7.5,-6.5 -8.3,-9.4" fill="#C8A55A"/>
    <circle cx="0" cy="0" r="2.5" fill="#C8A55A"/>
  </g>

  <!-- W letter -->
  <text x="512" y="780" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="260" fill="#C8A55A" letter-spacing="4">W</text>
</svg>
